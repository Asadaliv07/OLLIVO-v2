name: ollivo
description: "Ollivo - 100% Local-First Private AI Workspace for macOS Desktop"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
