services:
  airllm:
    build:
      context: ./airllm_service
      dockerfile: Dockerfile
    container_name: ollivo-airllm-service
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - AIRLLM_HOST=0.0.0.0
      - AIRLLM_PORT=8765
      - AIRLLM_MODEL_ID=${AIRLLM_MODEL_ID:-meta-llama/Meta-Llama-3-8B-Instruct}
      - AIRLLM_COMPRESSION=${AIRLLM_COMPRESSION:-4bit}
      - AIRLLM_DEVICE=${AIRLLM_DEVICE:-auto}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - airllm_hub_cache:/home/ollivo/.cache/ollivo/airllm/hub
      - airllm_shards_cache:/home/ollivo/.cache/ollivo/airllm/shards
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional Local Vector Database Services (Run with: docker compose --profile vector up -d)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ollivo-qdrant
    restart: unless-stopped
    profiles: ["vector"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  chroma:
    image: chromadb/chroma:latest
    container_name: ollivo-chroma
    restart: unless-stopped
    profiles: ["vector"]
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  airllm_hub_cache:
    name: ollivo_airllm_hub
  airllm_shards_cache:
    name: ollivo_airllm_shards
  qdrant_storage:
    name: ollivo_qdrant_storage
  chroma_data:
    name: ollivo_chroma_data

